[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "week03-ant-robust"
version = "0.1.0"
description = "Reproducible Isaac-Ant-v0 PPO robustness study for Robotics Simulation Week 03"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Robotics Simulation Week 03 Team" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
